[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4math"
version = "0.2.3"
description = "LLM-powered mathematical tool-calling system for analysis, abstract algebra, and probability theory"
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",
    "openai>=1.30",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
ai4math = "ai4math.cli:main"

[tool.setuptools.packages.find]
include = ["ai4math*"]

[tool.setuptools.package-data]
"ai4math" = ["tools/theorems/*.json", "tools/theorems/*.md"]
